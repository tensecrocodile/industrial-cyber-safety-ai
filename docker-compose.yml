version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: icsa-postgres
    environment:
      POSTGRES_DB: cyber_safety_ai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icsa_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: icsa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - icsa_network

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icsa-backend
    environment:
      DATABASE_URL: postgresql://admin:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/cyber_safety_ai
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET:-your-secret-key-change-in-production}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-key-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    command: >-
      bash -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - icsa_network

volumes:
  postgres_data:
  redis_data:

networks:
  icsa_network:
    driver: bridge
